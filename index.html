<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Nieuwe Rentmeesters — Landgoedplatform</title>
<meta name="description" content="Overzichtelijk en proactief landgoedbeheer: documenten, contracten, financieel inzicht en signalering op één plek.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F1F3F6;
  --white: #FFFFFF;
  --primary: #1B3A28;
  --primary-mid: #2A5C3F;
  --primary-light: #EAF0EC;
  --text: #111827;
  --text-2: #6B7280;
  --text-3: #9CA3AF;
  --border: #E5E7EB;
  --radius: 14px;
  --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.card {
  background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--card-shadow); max-width:560px; width:100%; padding:48px 44px; text-align:center;
}
.logo {
  width:52px; height:52px; border-radius:12px; background:var(--primary); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:22px;
  margin-bottom:24px;
}
.label {
  font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--text-3); margin-bottom:10px;
}
h1 { font-size:26px; font-weight:700; line-height:1.2; margin-bottom:14px; }
p.lead { font-size:15px; color:var(--text-2); line-height:1.55; margin-bottom:32px; }
.btn {
  display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
  font-weight:600; font-size:14.5px; padding:13px 28px; border-radius:10px; transition:background .15s;
}
.btn:hover { background:var(--primary-mid); }
.foot { margin-top:28px; font-size:12.5px; color:var(--text-3); }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">R</div>
    <div class="label">Landgoedplatform</div>
    <h1>De Nieuwe Rentmeesters</h1>
    <p class="lead">Overzichtelijk en proactief landgoedbeheer — documenten, contracten, financieel inzicht en signalering op één plek.</p>
    <a id="app-link" class="btn" href="#">Open het platform →</a>
    <div class="foot">Inloggen vereist · alleen voor beheerders</div>
  </main>
<script>
  // Productie-URL van de Next.js-app op Vercel. Pas aan na de eerste deploy.
  var APP_URL = "https://denieuwerentmeesters.vercel.app";
  document.getElementById("app-link").href = APP_URL;
</script>
</body>
</html>
